# Провайдеры LLM. Выбор: LLM_PROVIDER в .env или ключ --llm в командной строке.
# Ключи API — только в .env (имя переменной — api_key_env). Модель можно переопределить переменной model_env.
# type = "anthropic"          — официальный SDK anthropic (Claude);
# type = "openai_compatible"  — официальный SDK openai с base_url: OpenAI, xAI Grok, Groq, Gemini, DeepSeek, Ollama…
# type = "template"           — без LLM: заключение собирается по шаблону из рассчитанных показателей.
# В LLM уходят только рассчитанные показатели, зоны и сигналы (агрегаты по юрлицу), не строки CSV-файлов.

default_provider = "anthropic"

[providers.anthropic]
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
model_env = "ANTHROPIC_MODEL"
model = "claude-opus-5-5"
max_tokens = 16000
effort = "medium"            # low | medium | high | xhigh | max
fallbacks = "default"        # серверный фолбэк при отказе модели; "" — выключить

[providers.openai]
type = "openai_compatible"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model_env = "OPENAI_MODEL"
model = ""

[providers.xai]               # Grok (xAI)
type = "openai_compatible"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
model_env = "XAI_MODEL"
model = ""

[providers.groq]              # Groq Cloud (Llama, Qwen и др.)
type = "openai_compatible"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
model_env = "GROQ_MODEL"
model = ""

[providers.gemini]
type = "openai_compatible"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"
model_env = "GEMINI_MODEL"
model = ""

[providers.deepseek]
type = "openai_compatible"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
model_env = "DEEPSEEK_MODEL"
model = ""

[providers.ollama]            # локальная модель, данные не покидают компьютер
type = "openai_compatible"
base_url = "http://localhost:11434/v1"
api_key_env = ""
model_env = "OLLAMA_MODEL"
model = ""

[providers.none]
type = "template"
