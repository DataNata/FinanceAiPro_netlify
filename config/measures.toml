[pl.income_tax]
name = "Налог на прибыль"
hint = "расход — со знаком «−»"
ref = "[Income tax]"
codes = ["6000000000"]
sign = -1
missing = "zero"

[pl.interest_bank]
name = "Банковские проценты"
hint = "расход — со знаком «−»"
ref = "[Interest expense_forEbitda]"
codes = ["5001020100"]   # Bank interest; факторинг, аренда, ICO — не включаются
sign = -1
missing = "zero"

[pl.amortisation]
name = "Амортизация"
hint = "расход — со знаком «−»"
ref = "[Amortisation_forEbitda]"
codes = ["4001070000"]   # Depreciation / Amortisation
sign = -1
missing = "nan"

[pl.inventory_stat]
name = "Запасы (статистическая строка ОПУ, для контроля)"
ref = "inventory"
codes = ["9400000000"]
sign = 1
missing = "nan"

