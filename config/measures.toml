# Маппинг мер Методики (Приложение А) на коды статей (колонка code в CSV-файлах).
#   [pl.*] — ОПУ, data/csv/pl.csv: помесячные обороты (USD).
#   [bs.*] — баланс, data/csv/bs.csv: остаток на конец месяца (USD).
# sign: в ОПУ расходы хранятся со знаком «−»; sign = -1 переводит расход в положительную сумму.
# hint: подсказка к статье в шаблоне CSV (колонка line_name), labels: названия кодов, если их у меры несколько.
# missing: "zero" — нет строки за месяц, значит 0; "nan" — показатель не определён (например, амортизация не выделена).
# Решения по маппингу (согласовано 03.11.2026):
#   ОПУ — итог Level 0 (Statutory + Operational adj.);
#   ДЗ — только торговая перед третьими лицами, без авансов и ICO;
#   КЗ — торговая перед третьими лицами + торговая внутригрупповая (ICO), без авансов и ребейтов
#        (03.11.2026: поставщиков фактически финансирует группа, без ICO DPO ≈ 0 у всех юрлиц);
#   банковский долг — без факторинга и аренды.

[pl.revenue]
name = "Выручка"
ref = "[Revenue]"
codes = ["1000000000"]
sign = 1
missing = "nan"

[pl.cost_of_sales]
name = "Себестоимость продаж"
hint = "расход — со знаком «−»"
ref = "[Cost of sales]"
codes = ["2000000000"]
sign = -1
missing = "nan"

[pl.gross_profit]
name = "Валовая прибыль"
hint = "убыток — со знаком «−»"
ref = "[Gross profit]"
codes = ["8000000000"]
sign = 1
missing = "nan"

[pl.profit_before_tax]
name = "Прибыль до налогообложения"
hint = "убыток — со знаком «−»"
ref = "[Profit before tax]"
codes = ["9100000000"]
sign = 1
missing = "nan"

[pl.net_profit]
name = "Чистая прибыль"
hint = "убыток — со знаком «−»"
ref = "[Net profit]"
codes = ["7000000000"]
sign = 1
