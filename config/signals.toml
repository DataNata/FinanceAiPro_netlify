# Сигналы раннего предупреждения — раздел 7 Методики. Условия — в src/financeai/signals.py.

[dio_up]
signal = "DIO растёт два периода подряд, доля запасов в активах растёт"
cause = "Избыточные закупки, слабый спрос, ожидание новой модели"
action = "Ограничить закупки, распродать остатки до выхода нового релиза"
owner = "Закупки, коммерческий директор"

[dso_up]
signal = "DSO растёт при стабильной выручке"
cause = "Отсрочки клиентам, слабый сбор долгов"
action = "Ревизия кредитных лимитов, претензионная работа"
owner = "Коммерческий директор"

[dpo_down]
signal = "DPO сокращается"
cause = "Ужесточение условий вендора"
action = "Переговоры об условиях, диверсификация поставщиков"
owner = "Финансовый директор"

[ccc_high]
signal = "Денежный цикл > 30 дней"
cause = "Совокупность роста DIO, DSO и сокращения DPO"
action = "План по оборотному капиталу с целевыми днями"
owner = "Финансовый директор"

[overtrading]
signal = "Выручка растёт, текущая ликвидность падает, растут ТО и запасы"
cause = "Овертрейдинг"
action = "Притормозить рост продаж в кредит, долгосрочное финансирование под рост"
owner = "Генеральный директор"

[gm_down]
signal = "Валовая маржа падает"
cause = "Ценовая конкуренция, скидки, курсовые потери"
action = "Анализ цен и промо, пересмотр условий с вендорами"
owner = "Коммерческий директор"

[dol_high]
signal = "DOL > 5 или отрицательный"
cause = "Расходы растут быстрее продаж"
action = "Ревизия аренды, штата, маркетинга"
owner = "Генеральный директор"

[debt_high]
signal = "Покрытие банковских процентов < 2 или долг / EBITDA > 3,5"
cause = "Высокая долговая нагрузка"
action = "Сокращение банковских кредитов, высвобождение оборотного капитала"
owner = "Финансовый директор"

[differential_low]
signal = "Дифференциал ROA* − i < 5 п. п."
cause = "Рентабельность падает, кредиты дорожают"
action = "Мораторий на новые кредиты, рефинансирование"
owner = "Финансовый директор"

[z_yellow]
signal = "Z-модель в жёлтой зоне два периода подряд"
cause = "Падение рентабельности и оборачиваемости"
action = "Пересмотр ассортимента, каналов, структуры расходов"
owner = "Собственники, генеральный директор"
