# Общие настройки помощника.

[entities]
# Справочник юрлиц группы. Анализируются все юрлица, что есть в CSV-файлах (колонка entity_code).
codes = ["589", "780", "781", "785", "787", "790", "797"]

[entities.countries]
# Страна юрлица — для фильтра на HTML-странице; юрлица, которых здесь нет, попадут в «Без страны»
"589" = "Грузия"
"780" = "Азербайджан"
"781" = "Украина"
"785" = "Армения"
"787" = "Казахстан"
"790" = "Узбекистан"
"797" = "Молдова"
"902" = "Грузия"    # тестовая компания ОАОМэри (data/csv/examples/mary)

[params]
# Минимальный период данных: столько месяцев подряд нужно по каждому юрлицу в pl.csv и в bs.csv
# (квартал + тот же квартал прошлого года; долг / EBITDA и Z-модель — за 12 месяцев). Меньше — файл не принимается,
# шаблон короче не скачивается.
min_months = 15
# Контроль данных: допустимое расхождение запасов ОПУ (9400000000) и баланса (1201000000).
inventory_check_tolerance = 0.02
# Расхождение актива и пассива, USD.
balance_check_tolerance = 1.0
# Тест на овертрейдинг: «быстрый рост выручки» — рост к прошлому году больше этой доли.
overtrading_revenue_growth = 0.20
# Тест на овертрейдинг: (запасы + ДЗ) сравниваются с выручкой за столько последних месяцев.
overtrading_revenue_months = 3
# Неденежный рабочий капитал «около нуля»: не больше этой доли годовой выручки.
non_cash_wc_near_zero = 0.02
# «Ухудшение в пределах зелёной зоны N периодов подряд приравнивается к жёлтой».
worsening_periods = 3
# Точка безубыточности «близка» к выручке слабых месяцев: в пределах ±доли.
bep_tolerance = 0.10
# DOL не считается, если выручка изменилась меньше чем на эту долю (деление на ~0).
dol_min_sales_change = 0.005

[market_rates]
# Рыночная ставка банковских кредитов в USD (годовая, доля) по юрлицам — для зоны r_D.
# Не заполнено — r_D показывается справочно, без зоны.
# "780" = 0.12
